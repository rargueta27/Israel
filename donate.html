<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Donate - Israel Forever</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f4f7f9;
            color: #333;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Navbar Styling */
        nav {
            background-color: #ffffff;
            padding: 10px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }

        .nav-left {
            display: flex;
            align-items: center;
        }

        .nav-left img {
            height: 50px;
            width: auto;
            margin-right: 15px;
            border-radius: 4px;
        }

        .nav-left span {
            font-size: 1.5rem;
            font-weight: bold;
            color: #0038b8; /* Classic blue tone */
        }

        .home-btn {
            text-decoration: none;
            background-color: #0038b8;
            color: white;
            padding: 8px 20px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .home-btn:hover {
            background-color: #00267d;
        }

        /* Main Content */
        .container {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 2rem;
            line-height: 1.4;
            max-width: 800px;
            margin-bottom: 10px;
        }

        .adelson-credit {
            font-size: 1.2rem;
            font-style: italic;
            margin-bottom: 30px;
            color: #555;
        }

        .donate-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.2rem;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(40, 167, 69, 0.3);
            transition: transform 0.2s, background 0.3s;
        }

        .donate-btn:hover {
            background-color: #218838;
            transform: translateY(-2px);
        }

        /* Footer */
        footer {
            background-color: #333;
            color: white;
            text-align: center;
            padding: 20px 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-left">
            <img src="Temple.Jpeg" alt="Temple Image">
            <span>Israel Forever</span>
        </div>
        <a href="index.html" class="home-btn">Home</a>
    </nav>

    <div class="container">
        <h1>Thank You for your support as we keep educating people about Israel, and composing more music for Israel</h1>
        <p class="adelson-credit">Israel Forever</p>
        
        <button id="stripe-button" class="donate-btn">Donate Securely</button>
    </div>

    <footer>
        &copy; 2026 Israel Forever: The Eternal Return
    </footer>

    <script>
        document.getElementById('stripe-button').addEventListener('click', function() {
            // This will open the Stripe link in the same window
            window.location.href = 'https://buy.stripe.com/bJe6oIetJ1K44W72vqfQI01';
            
            // NOTE: If you want it to open in a NEW tab instead, use this line:
            // window.open('https://buy.stripe.com/bJe6oIetJ1K44W72vqfQI01', '_blank');
        });
    </script>

</body>
</html>
